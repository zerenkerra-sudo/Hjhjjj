
name: Islam Rehberi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f \
            -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare debug signing
        run: |
          cd "$PROJECT_DIR"

          sed -i \
            '/signingConfig = signingConfigs.getByName("debugConfig")/d' \
            app/build.gradle.kts

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islam-Rehberi-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
